<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label</title>
</head>
<body>
    <p><label for="username">Username : </label>
    <input type="text" name="" id="username">
    </p>
    <!-- dengan menggubakan Label, user akan dimudahkan pada elemen yang kita buat -->
     <p> pilihan
        <label for="pilihan">
        <input type="checkbox" name="" id="pilihan"> HTML </label>
     </p>
     <p> Jenis Kelamin
        <label for="laki-laki">
        <input type="radio" name="" id="laki-laki"> laki -laki
        </label>
        <label for="perempuan">
        <input type="radio" name="" id="perempuan"> Perempuan
        </label>
     </p>
</body>
</html>
