<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset | Legend</title>
</head>
<body>
    <fieldset>
        <legend>Data Peserta</legend>
        <p>Nama: <input type="text"></p>
        <p>Alamat : <input type="text"></p>
        <!-- Tag Legend digunakan untuk memberi judul data yang kita kelompokkan -->
    </fieldset>
    <!-- fieldset digunakan untuk kontainer atau pembungkus semua elemen form yang terkait dengan data peserta -->
    <fieldset>
        <legend>
            Paket pilihan
        </legend>
        <p><input type="checkbox" name="" id="">HTML</p>
        <p><input type="checkbox" name="" id="">CSS</p>
        <p><input type="checkbox" name="" id="">Java Script</p>
        <p><input type="checkbox" name="" id="">PHP</p>
    </fieldset>
</body>
</html>
