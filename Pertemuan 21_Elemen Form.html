<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen Form HTML</title>
</head>
<body>
    <!-- Tujuan Form untuk membuat halaman registrasi, halaman login, halaman pencarian dan masih banyak lagi -->
    <!-- Diawali tag form yang menandai kalau semua elemen form itu cuma 1 grup -->
    <form action="">
        <!-- yang membedakan type input ini dari attributenya -->
        <p>Username : <input type="text"></p>
        <p>Password : <input type="password"></p>
        <button>type="submit" name="submit" Login</button>
    </form>
</body>
</html>
