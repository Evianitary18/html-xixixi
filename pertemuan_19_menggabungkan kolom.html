<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Pertemuan 19</title>
</head>
<body>
    <table border="1" cellspacing="10" cellpadding="10" align="center">
        <caption>Elemen Tabel Pada HTML</caption>
        <tr>
            <th>Ini kolom 1</th>
            <th>Ini kolom 2</th>
            <th>Ini kolom 3</th>
        </tr>
        <tr>
            <td>Ini baris 2 kolom 1</td>
            <!-- untuk menggabungkan kolom pakai colspan dan nilai atributnya di sini 2 karena kan menggabungkan 2 kolom -->
            <td colspan="2">Ini baris 2 kolom 1</td>
            
        </tr>
        <tr>
            <td rowspan="2">Ini baris 3 kolom 1</td>
            <td>Ini baris 3 kolom 2</td>
            <td>Ini baris 3 kolom 3</td>
        </tr>
        <tr>
            <!-- <td>Ini baris 4 kolom 1</td> -->
            <td>Ini baris 4 kolom 2</td>
            <td>Ini baris 4 kolom 3</td>
        </tr>
    </table>
</body>
</html>
